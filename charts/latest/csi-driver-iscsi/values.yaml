image:
  baseRepo: registry.k8s.io/sig-storage
  iscsi:
    repository: gcr.io/k8s-staging-sig-storage/iscsiplugin
    tag: canary
    pullPolicy: IfNotPresent
  csiProvisioner:
    repository: /csi-provisioner
    tag: v5.2.0
    pullPolicy: IfNotPresent
  csiAttacher:
    repository: /csi-attacher
    tag: v4.8.0
    pullPolicy: IfNotPresent
  livenessProbe:
    repository: /livenessprobe
    tag: v2.20.0
    pullPolicy: IfNotPresent
  nodeDriverRegistrar:
    repository: /csi-node-driver-registrar
    tag: v2.18.0
    pullPolicy: IfNotPresent

imagePullSecrets: []
kubeletDir: /var/lib/kubelet

targetd:
  enabled: false
  backendID: ""
  endpoint: ""
  pools: []
  namespace: ""
  targetIQN: ""
  portals: []
  username: admin
  existingSecret: csi-targetd-credentials
  existingCAConfigMap: ""

controller:
  nodeSelector: {}
  affinity: {}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  priorityClassName: system-cluster-critical
  resources:
    iscsi:
      requests: {cpu: 10m, memory: 20Mi}
      limits: {memory: 300Mi}
    livenessProbe:
      requests: {cpu: 10m, memory: 20Mi}
      limits: {memory: 100Mi}
    csiProvisioner:
      requests: {cpu: 10m, memory: 20Mi}
      limits: {memory: 200Mi}
    csiAttacher:
      requests: {cpu: 10m, memory: 20Mi}
      limits: {memory: 200Mi}

node:
  stateDir: /var/lib/iscsi.csi.k8s.io
  nodeSelector: {}
  affinity: {}
  tolerations:
    - operator: Exists
  priorityClassName: system-node-critical
  resources:
    iscsi:
      requests: {cpu: 10m, memory: 20Mi}
      limits: {memory: 300Mi}
    livenessProbe:
      requests: {cpu: 10m, memory: 20Mi}
      limits: {memory: 100Mi}
    nodeDriverRegistrar:
      requests: {cpu: 10m, memory: 20Mi}
      limits: {memory: 200Mi}

storageClass:
  create: false
  name: iscsi-targetd
  pool: ""
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
