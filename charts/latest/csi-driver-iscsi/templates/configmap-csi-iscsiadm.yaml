kind: ConfigMap
apiVersion: v1
metadata:
  name: configmap-csi-iscsiadm
  namespace: {{ .Release.Namespace }}
data:
  iscsiadm: |
    #!/bin/sh
    if [ -x /host/sbin/iscsiadm ]; then
      exec chroot /host /sbin/iscsiadm "$@"
    elif [ -x /host/usr/sbin/iscsiadm ]; then
      exec chroot /host /usr/sbin/iscsiadm "$@"
    elif [ -x /host/usr/local/sbin/iscsiadm ]; then
      exec chroot /host /usr/local/sbin/iscsiadm "$@"
    elif [ -x /host/bin/iscsiadm ]; then
      exec chroot /host /bin/iscsiadm "$@"
    elif [ -x /host/usr/local/bin/iscsiadm ]; then
      exec chroot /host /usr/local/bin/iscsiadm "$@"
    else
      exec chroot /host iscsiadm "$@"
    fi
---
